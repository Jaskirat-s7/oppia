name: Stress Test (Lighthouse)

permissions: read-all
on:
  workflow_dispatch:
    inputs:
      num_runs:
        description: 'Number of times to run the test.'
        required: true
        default: '5'
        type: choice
        options: ['1', '5', '10']
      test_suite:
        description: 'Name of lighthouse suite to run.'
        required: true
        default: 'uses-responsive-images'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      NUM_RUNS: ${{ inputs.num_runs }}
    steps:
      - name: Generate Matrix
        id: set-matrix
        shell: bash
        run: |
          MATRIX=$(seq 1 "$NUM_RUNS" | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  run_lighthouse_stress_test:
    needs: [generate-matrix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: "Run ${{ matrix.run }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies

      # This works! (Took 51s in your screenshot)
      - name: Install Third Party Libs
        run: python -m scripts.install_third_party_libs

      # REMOVED: "Install Chrome" (Since the script doesn't exist and Runner has Chrome)

      - name: Run Lighthouse Performance Test
        run: |
          echo "Starting Run #${{ matrix.run }}..."
          # This script handles the rest (building + server start)
          python -m scripts.run_performance_tests --suite="${{ inputs.test_suite }}"

      - name: Upload Lighthouse Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-run-${{ matrix.run }}
          path: /home/runner/work/oppia/oppia/lighthouse-reports
          retention-days: 1