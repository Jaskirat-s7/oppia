name: Stress Test (Lighthouse)

permissions: read-all
on:
  workflow_dispatch:
    inputs:
      num_runs:
        description: 'Number of times to run the test.'
        required: true
        default: '5'
        type: choice
        options: ['1', '5', '10', '20']
      test_suite:
        description: 'Name of lighthouse suite to run.'
        required: true
        default: 'uses-responsive-images'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      NUM_RUNS: ${{ inputs.num_runs }}
    steps:
      - name: Generate Matrix
        id: set-matrix
        shell: bash
        run: |
          MATRIX=$(seq 1 "$NUM_RUNS" | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  run_lighthouse_stress_test:
    needs: [generate-matrix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: "Run ${{ matrix.run }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Environment
      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies

      # 2. Build the App Locally (No downloading artifacts)
      - name: Generate build files
        uses: ./.github/actions/generate-build-files

      # 3. Run the Test
      - name: Run Lighthouse Performance Test
        run: |
          echo "Starting Run #${{ matrix.run }}..."
          python -m scripts.run_performance_tests --suite="${{ inputs.test_suite }}"

      # 4. Upload Report if it Fails
      - name: Upload Lighthouse Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-run-${{ matrix.run }}
          path: /home/runner/work/oppia/oppia/lighthouse-reports
          retention-days: 1