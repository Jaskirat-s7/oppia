name: Stress Test - Lighthouse Performance (uses-responsive-images)

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: 'Number of parallel test runs'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '20'

jobs:
  stress-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Generates an array [1, 2, ... N] based on input
        run_number: ${{ fromJSON(format('[{0}]', join(range(1, fromJSON(github.event.inputs.run_count) + 1), ','))) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      # Essential: Install the libraries Chrome needs to run on Linux
      - name: Install Chrome System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates fonts-liberation \
          libappindicator3-1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 \
          libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
          libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
          libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 \
          libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 \
          libxrandr2 libxrender1 libxss1 libxtst6 lsb-release xdg-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyyaml
      
      - name: Install third-party dependencies
        run: |
          # This installs Puppeteer (which includes Chrome) and other libs
          python -m scripts.install_third_party_libs
      
      - name: Build Oppia (Prod Env)
        run: |
          # Build locally to avoid artifact conflicts
          python -m scripts.build --prod_env
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
      
      - name: Run Performance Test (uses-responsive-images)
        run: |
          mkdir -p lighthouse-reports/run-${{ matrix.run_number }}
          
          echo "Starting Run #${{ matrix.run_number }}..."
          python -m scripts.run_performance_tests \
            --suite="uses-responsive-images" \
            2>&1 | tee lighthouse-reports/run-${{ matrix.run_number }}/test-output.log
      
      - name: Upload Lighthouse Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-run-${{ matrix.run_number }}
          path: lighthouse-reports/run-${{ matrix.run_number }}/
          retention-days: 7