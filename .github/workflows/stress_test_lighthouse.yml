name: Lighthouse Stress Test (Donate Page)

on: [workflow_dispatch]

jobs:
  stress_test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Chrome System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install pyyaml

      - name: Install Third Party Libs
        run: python -m scripts.install_third_party_libs

      - name: Build Oppia (Prod Env)
        run: python -m scripts.build --prod_env
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Start Oppia Server
        run: |
          # Start the server in the background
          # We use scripts.start but we need to make sure it doesn't block. 
          # Actually, scripts.start starts the dev server. run_lighthouse_tests uses managed_dev_appserver.
          # Let's use the simplest way: python -m scripts.start
          # But scripts.start is interactive/blocking.
          # A better way is to use the same logic as run_lighthouse_tests but detached.
          # For simplicity in this stress test, let's try starting it in background.
          
          python -m scripts.start --no_browser &
          PID=$!
          echo "Server PID: $PID"
          
          # Wait for port 8181 to be listening
          echo "Waiting for server to start on port 8181..."
          for i in {1..30}; do
            if nc -z localhost 8181; then
              echo "Server is up!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

      - name: Install Lighthouse CLI
        run: npm install -g lighthouse

      - name: Run Lighthouse Stress Test Loop
        run: |
          mkdir -p lighthouse_results
          echo "Run,Score,WastedBytes" > lighthouse_results/summary.csv
          
          # Loop 20 times (or more)
          for i in {1..20}; do
            echo "----------------------------------------------------------------"
            echo "Starting Run $i/20"
            
            # Run Lighthouse
            # We use --chrome-flags to ensure it runs in CI environment
            npx lighthouse http://localhost:8181/donate \
              --only-audits=uses-responsive-images \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --output=json \
              --output-path=lighthouse_results/run_$i.json \
              --quiet
            
            # Parse results
            SCORE=$(python3 -c "import json; print(json.load(open('lighthouse_results/run_$i.json'))['audits']['uses-responsive-images']['score'])")
            WASTED=$(python3 -c "import json; items=json.load(open('lighthouse_results/run_$i.json'))['audits']['uses-responsive-images'].get('details',{}).get('items',[]); print(sum(i.get('wastedBytes',0) for i in items))")
            
            echo "$i,$SCORE,$WASTED" >> lighthouse_results/summary.csv
            echo "Result: Score=$SCORE, Wasted=${WASTED} bytes"
            
            # Sleep a bit to allow server to "breathe" if needed, or to simulate random timing
            sleep 2
          done
          
          echo "----------------------------------------------------------------"
          echo "Final Summary:"
          cat lighthouse_results/summary.csv

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-stress-test-results
          path: lighthouse_results/